version: "3.9"

services:

  client:
    build: ./client
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always
  server:
    build: ./server
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/src/.env
    expose:
      - 5000
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
  
volumes:
    mongo_data: