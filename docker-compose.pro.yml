version: "3.9"

services:

  client:
    image: kimxuanvinh2002/retailclient:latest
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

  server:
    image: kimxuanvinh/retailserver:latest
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/src/.env
    restart: always